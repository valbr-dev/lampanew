<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>Крестики-нолики</title>
<style>
:root{color-scheme:dark;--bg:#10131d;--panel:#191e2b;--line:#30394b;--muted:#9ba7bb;--text:#f4f6fb;--x:#8bb7ff;--o:#ffb86b;--accent:#9c8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#252747 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,430px)}.eyebrow{text-align:center;color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
h1{text-align:center;font-size:clamp(2rem,8vw,3rem);letter-spacing:-.06em;margin:7px 0 5px}.sub{text-align:center;color:var(--muted);margin:0 0 25px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.score-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 16px;text-align:center}.score-card span{display:block;color:var(--muted);font-size:.82rem}.score-card strong{font-size:1.8rem}.score-card.x strong{color:var(--x)}.score-card.o strong{color:var(--o)}
.status{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:14px;font-weight:650}.dot{width:10px;height:10px;border-radius:50%;background:var(--x)}.dot.o{background:var(--o)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;background:#0b0e16;padding:10px;border:1px solid var(--line);border-radius:20px}
.cell{border:1px solid var(--line);border-radius:13px;background:var(--panel);font:700 clamp(2.8rem,15vw,4.4rem)/1 system-ui;cursor:pointer;transition:background .15s,transform .15s;display:grid;place-items:center;color:var(--text);-webkit-tap-highlight-color:transparent}
.cell:hover:empty{background:#252c3d}.cell:active{transform:scale(.96)}.cell.x{color:var(--x)}.cell.o{color:var(--o)}.cell.win{background:#34304f;border-color:var(--accent)}.cell:disabled{cursor:default}
.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel);color:var(--text);font:600 .95rem system-ui;cursor:pointer}.actions button.primary{background:var(--accent);border-color:var(--accent);color:#11101b}.actions button:hover{filter:brightness(1.12)}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin:18px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Мини-игра</div>
  <h1>Крестики-нолики</h1>
  <p class="sub">Классическая игра для двух игроков</p>
  <section class="score" aria-label="Счёт">
    <div class="score-card x"><span>Крестики · X</span><strong id="scoreX">0</strong></div>
    <div class="score-card o"><span>Нолики · O</span><strong id="scoreO">0</strong></div>
  </section>
  <div class="status" role="status" aria-live="polite"><i class="dot" id="dot"></i><span id="status">Ход крестиков</span></div>
  <section class="board" id="board" aria-label="Игровое поле">
    <button class="cell" aria-label="Клетка 1"></button><button class="cell" aria-label="Клетка 2"></button><button class="cell" aria-label="Клетка 3"></button>
    <button class="cell" aria-label="Клетка 4"></button><button class="cell" aria-label="Клетка 5"></button><button class="cell" aria-label="Клетка 6"></button>
    <button class="cell" aria-label="Клетка 7"></button><button class="cell" aria-label="Клетка 8"></button><button class="cell" aria-label="Клетка 9"></button>
  </section>
  <div class="actions"><button class="primary" id="restart">Новая партия</button><button id="reset">Сбросить счёт</button></div>
  <p class="hint">Первый ход за X. Собери три символа в ряд, столбец или диагональ.</p>
</main>
<script>
(() => {
  const cells = [...document.querySelectorAll('.cell')];
  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  const scoreX = document.getElementById('scoreX');
  const scoreO = document.getElementById('scoreO');
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board = Array(9).fill('');
  let turn = 'X';
  let active = true;
  let scores = {X:0,O:0};

  function setStatus(message, player = turn) {
    status.textContent = message;
    dot.className = 'dot' + (player === 'O' ? ' o' : '');
  }
  function finish(message, winner, line) {
    active = false;
    setStatus(message, winner || turn);
    if (winner) {
      scores[winner]++;
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      line.forEach(i => cells[i].classList.add('win'));
    }
    cells.forEach(cell => cell.disabled = true);
  }
  function play(index) {
    if (!active || board[index]) return;
    board[index] = turn;
    const cell = cells[index];
    cell.textContent = turn;
    cell.classList.add(turn.toLowerCase());
    cell.setAttribute('aria-label', 'Клетка ' + (index + 1) + ': ' + (turn === 'X' ? 'крестик' : 'нолик'));
    cell.disabled = true;
    const win = wins.find(line => line.every(i => board[i] === turn));
    if (win) return finish((turn === 'X' ? 'Крестики' : 'Нолики') + ' победили!', turn, win);
    if (board.every(Boolean)) return finish('Ничья! Попробуйте ещё раз.', null);
    turn = turn === 'X' ? 'O' : 'X';
    setStatus('Ход ' + (turn === 'X' ? 'крестиков' : 'ноликов'));
  }
  function restart() {
    board = Array(9).fill('');
    turn = 'X';
    active = true;
    cells.forEach((cell, i) => {
      cell.textContent = '';
      cell.disabled = false;
      cell.className = 'cell';
      cell.setAttribute('aria-label', 'Клетка ' + (i + 1));
    });
    setStatus('Ход крестиков');
  }
  cells.forEach((cell, i) => cell.addEventListener('click', () => play(i)));
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('reset').addEventListener('click', () => {
    scores = {X:0,O:0};
    scoreX.textContent = '0';
    scoreO.textContent = '0';
    restart();
  });
})();
</script>
</body>
</html>
